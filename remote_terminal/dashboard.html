<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nous System Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1117;color:#e1e4e8;padding:16px}
h1{font-size:20px;margin-bottom:16px;color:#58a6ff}
h2{font-size:14px;color:#8b949e;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.badge-ok{background:#1a3a2a;color:#3fb950}
.badge-warn{background:#3a2f1a;color:#d2991d}
.badge-err{background:#3a1a1a;color:#f85149}
.badge-info{background:#1a2a3a;color:#58a6ff}
table{width:100%;font-size:12px;border-collapse:collapse}
th,td{padding:4px 8px;text-align:left;border-bottom:1px solid #21262d}
th{color:#8b949e;font-weight:500}
.mono{font-family:'Cascadia Code',Consolas,monospace;font-size:11px}
.empty{color:#484f58;font-style:italic;padding:8px}
.stat{font-size:24px;font-weight:700}
.stat-label{font-size:11px;color:#8b949e}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.refresh{color:#58a6ff;cursor:pointer;font-size:12px;float:right}
.refresh:hover{text-decoration:underline}
</style>
</head>
<body>
<h1>⚡ Nous System Dashboard <span style="font-size:12px;color:#8b949e;float:right" id="clock"></span></h1>
<div class="grid">
  <div class="card">
    <h2>🧠 Brain Status <span class="refresh" onclick="load()">refresh</span></h2>
    <div class="row" id="brain"></div>
  </div>
  <div class="card">
    <h2>🖥️ Devices</h2>
    <div id="devices"></div>
  </div>
  <div class="card">
    <h2>📡 Recent Events</h2>
    <div id="events"></div>
  </div>
  <div class="card">
    <h2>📋 Running Jobs</h2>
    <div id="jobs_running"></div>
  </div>
  <div class="card">
    <h2>❌ Failed Jobs</h2>
    <div id="jobs_failed"></div>
  </div>
  <div class="card">
    <h2>🔔 Recent Notifications</h2>
    <div id="notifications"></div>
  </div>
  <div class="card">
    <h2>🔒 High-Risk Audit</h2>
    <div id="audit_high"></div>
  </div>
  <div class="card">
    <h2>🤖 Automation Log</h2>
    <div id="automation_log"></div>
  </div>
  <div class="card">
    <h2>📥 Inbox</h2>
    <div id="inbox"></div>
  </div>
</div>
<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
async function load(){
  try{
    const r = await fetch('/dashboard/data?token='+TOKEN);
    const d = await r.json();
    renderBrain(d.brain);
    renderDevices(d.devices);
    renderEvents(d.events);
    renderJobs(d.jobs_running,'jobs_running','running');
    renderJobs(d.jobs_failed,'jobs_failed','failed');
    renderNotifications(d.notifications);
    renderAudit(d.audit_high);
    renderAutomationLog(d.automation_log);
    renderInbox(d.inbox);
    document.getElementById('clock').textContent = new Date().toLocaleTimeString();
  }catch(e){
    console.error(e);
  }
}
function renderBrain(b){
  if(!b||b.error){document.getElementById('brain').innerHTML='<span class="empty">offline</span>';return}
  document.getElementById('brain').innerHTML =
    `<div><span class="stat">${b.events_total}</span><span class="stat-label"> events</span></div>
     <div><span class="stat">${b.jobs_total}</span><span class="stat-label"> jobs</span></div>
     <div><span class="stat">${b.jobs_running}</span><span class="stat-label"> running</span></div>
     <div><span class="stat">${b.jobs_pending}</span><span class="stat-label"> pending</span></div>
     <div style="font-size:11px;color:#8b949e;margin-top:4px">Last: ${b.last_event}</div>`;
}
function renderDevices(arr){
  if(!arr||!arr.length){document.getElementById('devices').innerHTML='<div class="empty">no devices</div>';return}
  document.getElementById('devices').innerHTML = arr.map(d=>
    `<div class="row" style="justify-content:space-between">
      <span>${d.name||d.id} <span class="badge badge-info">${d.device_type}</span></span>
      <span class="badge ${d.is_online?'badge-ok':'badge-err'}">${d.is_online?'ONLINE':'OFFLINE'}</span>
    </div>`).join('');
}
function renderEvents(arr){
  document.getElementById('events').innerHTML = arr.map(e=>
    `<div class="row" style="justify-content:space-between;font-size:11px">
      <span class="mono">${e.type}</span>
      <span style="color:#484f58">${e.source}</span>
      <span class="badge ${e.processed?'badge-ok':'badge-warn'}">${e.processed?'done':'pending'}</span>
    </div>`).join('')||'<div class="empty">no events</div>';
}
function renderJobs(arr,id,status){
  document.getElementById(id).innerHTML = arr.map(j=>
    `<div style="font-size:11px;margin-bottom:4px">
      <span class="badge ${status=='failed'?'badge-err':'badge-warn'}">${j.status}</span>
      <span class="mono">${j.type}</span>
      <span style="color:#484f58">${j.source}</span>
      ${j.error?`<div style="color:#f85149;font-size:10px">${j.error}</div>`:''}
    </div>`).join('')||`<div class="empty">no ${status} jobs</div>`;
}
function renderNotifications(arr){
  document.getElementById('notifications').innerHTML = arr.map(n=>
    `<div style="font-size:11px;margin-bottom:4px">
      <span class="badge ${n.read_at?'badge-info':'badge-warn'}">${n.read_at?'read':'unread'}</span>
      <span>${n.title||n.type}</span>
      ${n.target_client?`<span class="badge badge-info">${n.target_client}</span>`:''}
    </div>`).join('')||'<div class="empty">no notifications</div>';
}
function renderAudit(arr){
  document.getElementById('audit_high').innerHTML = arr.map(a=>
    `<div style="font-size:11px;margin-bottom:4px">
      <span class="badge badge-err">${a.result}</span>
      <span class="mono">${a.action}</span>
      <span style="color:#484f58">${a.actor}</span>
    </div>`).join('')||'<div class="empty">no high-risk audit entries ✓</div>';
}
function renderAutomationLog(arr){
  document.getElementById('automation_log').innerHTML = arr.map(al=>
    `<div style="font-size:11px;margin-bottom:4px">
      <span class="badge ${al.success?'badge-ok':'badge-err'}">${al.success?'OK':'FAIL'}</span>
      <span>${al.rule_name||al.rule_id}</span>
      <span style="color:#484f58">→ ${al.action_type}</span>
    </div>`).join('')||'<div class="empty">no automation logs</div>';
}
function renderInbox(d){
  if(!d||!d.total_new){document.getElementById('inbox').innerHTML='<div class="empty">inbox empty</div>';return}
  let html = `<div style="font-size:14px;margin-bottom:8px"><span class="stat">${d.total_new}</span> <span class="stat-label">new items</span></div>`;
  for(const [cat,n] of Object.entries(d.by_category||{})){
    html += `<div class="row" style="justify-content:space-between;font-size:11px"><span>${cat}</span><span class="badge badge-info">${n}</span></div>`;
  }
  document.getElementById('inbox').innerHTML = html;
}
load();
setInterval(load,10000);
</script>
</body>
</html>
