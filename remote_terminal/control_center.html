<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nous Control Center</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--yellow:#d2991d;--red:#f85149;--purple:#a371f7}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
.sidebar{width:200px;background:var(--card);border-right:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.sidebar h2{font-size:16px;color:var(--accent);margin-bottom:8px;padding:4px 8px}
.tab{background:none;border:none;color:var(--muted);padding:8px 12px;text-align:left;cursor:pointer;border-radius:6px;font-size:13px;transition:.15s}
.tab:hover,.tab.active{background:#1c2333;color:var(--text)}
.tab .icon{margin-right:6px}
.main{flex:1;overflow-y:auto;padding:16px}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px}
.card h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{font-size:28px;font-weight:700}
.stat-label{font-size:11px;color:var(--muted)}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;display:inline-block}
.ok{background:#1a3a2a;color:var(--green)}
.warn{background:#3a2f1a;color:var(--yellow)}
.err{background:#3a1a1a;color:var(--red)}
.info{background:#1a2a3a;color:var(--accent)}
table{width:100%;font-size:12px;border-collapse:collapse}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:500}
.mono{font-family:'Cascadia Code',Consolas,monospace;font-size:11px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.empty{color:#484f58;font-style:italic;padding:20px;text-align:center}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:4px 0}
.progress-fill{height:100%;border-radius:3px;transition:width .3s}
input,select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:12px}
button{background:var(--accent);color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px}
button.danger{background:var(--red)}
button:hover{opacity:.85}
.graph{font-family:monospace;font-size:11px;line-height:1.6;white-space:pre;background:var(--bg);padding:10px;border-radius:6px;overflow-x:auto}
@media(max-width:768px){.sidebar{width:60px}.sidebar h2,.tab span{display:none}.grid2,.grid3,.grid4{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="sidebar">
<h2>⚡ Nous CC</h2>
<button class="tab active" onclick="showPanel('dashboard')"><span class="icon">📊</span> <span>Dashboard</span></button>
<button class="tab" onclick="showPanel('jobs')"><span class="icon">📋</span> <span>Jobs</span></button>
<button class="tab" onclick="showPanel('devices')"><span class="icon">🖥️</span> <span>Devices</span></button>
<button class="tab" onclick="showPanel('capabilities')"><span class="icon">⚙️</span> <span>Capabilities</span></button>
<button class="tab" onclick="showPanel('security')"><span class="icon">🔒</span> <span>Security</span></button>
<button class="tab" onclick="showPanel('learning')"><span class="icon">📚</span> <span>Learning</span></button>
<button class="tab" onclick="showPanel('tasks')"><span class="icon">🔀</span> <span>Task Graph</span></button>
</nav>
<main class="main" id="main"></main>

<script>
const T = new URLSearchParams(location.search).get('token')||'';
const API = '';
let DATA = {};

async function fetchAPI(path) {
  if (DATA._demo) return DATA._demo[path] || {};
  try { const r = await fetch(API+path+(path.includes('?')?'&':'?')+'token='+T);
        return r.json(); } catch(e) { return {}; }
}

async function showPanel(name) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`[onclick="showPanel('${name}')"]`).classList.add('active');
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">Loading...</div>';
  try {
    DATA = await fetchAPI('/dashboard/data');
    const renderers = {dashboard:renderDashboard, jobs:renderJobs, devices:renderDevices,
      capabilities:renderCapabilities, security:renderSecurity, learning:renderLearning, tasks:renderTasks};
    main.innerHTML = (renderers[name]||renderDashboard)();
  } catch(e) { main.innerHTML = `<div class="empty">Error: ${e.message}</div>`; }
}

function renderDashboard() {
  const b = DATA.brain||{}, d = DATA.devices||[], e = DATA.events||[], n = DATA.notifications||[];
  return `<div class="grid4">
    <div class="card"><h3>🧠 Brain</h3><div class="stat">${b.events_total||0}</div><div class="stat-label">events</div></div>
    <div class="card"><h3>📋 Jobs</h3><div class="stat">${b.jobs_total||0}</div><div class="stat-label">total (${b.jobs_running||0} running)</div></div>
    <div class="card"><h3>🖥️ Devices</h3><div class="stat">${d.length}</div><div class="stat-label">registered</div></div>
    <div class="card"><h3>📥 Inbox</h3><div class="stat">${(DATA.inbox||{}).total_new||0}</div><div class="stat-label">new items</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>📡 Recent Events</h3>${e.slice(0,8).map(ev=>`<div class="row"><span class="badge info">${ev.type}</span><span class="mono">${ev.source}</span></div>`).join('')||'<div class="empty">no events</div>'}</div>
    <div class="card"><h3>🔔 Notifications</h3>${n.slice(0,8).map(nf=>`<div class="row"><span class="badge ${nf.read_at?'info':'warn'}">${nf.read_at?'read':'unread'}</span><span>${nf.title||nf.type}</span></div>`).join('')||'<div class="empty">none</div>'}</div>
  </div>`;
}

function renderJobs() {
  const running = DATA.jobs_running||[], failed = DATA.jobs_failed||[];
  return `<div class="card"><h3>Running Jobs</h3>${running.length?running.map(j=>`<div class="row"><span class="badge warn">${j.status}</span><span class="mono">${j.type}</span><span style="color:var(--muted)">${j.source}</span></div>`).join(''):'<div class="empty">no running jobs</div>'}</div>
    <div class="card"><h3>Failed Jobs</h3>${failed.length?failed.map(j=>`<div class="row"><span class="badge err">${j.status}</span><span class="mono">${j.type}</span><div style="color:var(--red);font-size:10px">${j.error||''}</div></div>`).join(''):'<div class="empty">no failed jobs ✅</div>'}</div>`;
}

function renderDevices() {
  const devs = DATA.devices||[];
  return `<div class="card"><h3>Device Registry (${devs.length})</h3>
    ${devs.length?devs.map(d=>`<div class="card" style="margin:8px 0">
      <div class="row"><strong>${d.name||d.id}</strong><span class="badge info">${d.device_type||'unknown'}</span><span class="badge ${d.is_online?'ok':'err'}">${d.is_online?'ONLINE':'OFFLINE'}</span></div>
      <div style="font-size:11px;color:var(--muted)">Last seen: ${(d.last_seen||'').substring(0,19)||'never'}</div>
    </div>`).join(''):'<div class="empty">No devices registered. Connect via NEP or register manually.</div>'}</div>`;
}

function renderCapabilities() {
  return `<div class="card"><h3>Capability Registry</h3><div class="empty">Full capability list available via <code>GET /api/v1/kernel/capabilities</code></div></div>`;
}

function renderSecurity() {
  const audit = DATA.audit_high||[], alog = DATA.automation_log||[];
  return `<div class="grid2">
    <div class="card"><h3>🛡️ Risk Panel</h3>
      <div class="row"><span class="badge ok">LOW</span> Auto-execute</div>
      <div class="row"><span class="badge warn">MEDIUM</span> Execute + audit</div>
      <div class="row"><span class="badge err">HIGH</span> Require confirmation</div>
      <div class="row"><span class="badge err" style="background:#4a1a3a">CRITICAL</span> Confirm + revocable</div>
    </div>
    <div class="card"><h3>⏳ Approval Queue</h3>${audit.length?audit.map(a=>`<div class="row"><span class="badge err">${a.result}</span><span class="mono">${a.action}</span></div>`).join(''):'<div class="empty">No pending approvals ✅</div>'}</div>
  </div>
  <div class="card"><h3>📜 Recent Audit</h3>${audit.length?audit.map(a=>`<div class="row" style="font-size:11px"><span class="badge err">${a.result}</span><span>${a.action}</span><span style="color:var(--muted)">${a.actor}</span><span style="color:var(--muted)">${(a.created_at||'').substring(0,19)}</span></div>`).join(''):'<div class="empty">Clean audit log</div>'}</div>
  <div class="card"><h3>🤖 Automation Log</h3>${alog.length?alog.map(l=>`<div class="row" style="font-size:11px"><span class="badge ${l.success?'ok':'err'}">${l.success?'OK':'FAIL'}</span><span>${l.rule_name||l.rule_id}</span></div>`).join(''):'<div class="empty">No automation runs</div>'}</div>`;
}

function renderLearning() {
  return `<div class="grid2">
    <div class="card"><h3>📅 Today's Plan</h3><div class="empty">Load from <code>/learn/plan_v2</code></div></div>
    <div class="card"><h3>⚠️ Weak Points</h3><div class="empty">Load from <code>/learn/state</code></div></div>
  </div>
  <div class="card"><h3>📊 Daily Report</h3><div class="empty">Load from <code>/learn/report</code></div></div>`;
}

function renderTasks() {
  return `<div class="card"><h3>🔀 Task Graph</h3>
    <div class="graph">Capability Graph (27 nodes, 5 composed):
    study.summarize ──→ rag.search
                    ├──→ model.reason
                    └──→ notification.send
    device.pc.analyze → device.pc.screenshot
                      ├→ device.pc.shell
                      └→ model.code
    </div></div>
    <div class="card"><h3>📈 Job Timeline</h3><div class="empty">Recent capability executions shown in Dashboard</div></div>`;
}

// Init
showPanel('dashboard');
setInterval(()=>{ const p = document.querySelector('.tab.active'); if(p) showPanel(p.getAttribute('onclick').match(/'(.*?)'/)[1]); }, 15000);
</script>
</body>
</html>
