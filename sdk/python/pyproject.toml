[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nous-kernel-sdk"
version = "0.1.1"
description = "Python NKI client for Nous Foundation"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["apeir-distribution>=0.1.0rc1,<0.2"]

[tool.hatch.build.targets.wheel]
packages = ["nous_kernel"]
