name: Core CI
on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Optional investigation; never qualifies the Core gate
        type: choice
        default: none
        options: [none, windows-skill-http, windows-governance]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.diagnostic || 'none' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  python-tests:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic != 'none' && 'Full regression not selected (diagnostic only)' || format('Python Tests ({0}, Python {1})', matrix.os, matrix.python) }}
    if: github.event_name != 'workflow_dispatch' || inputs.diagnostic == 'none'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-22.04","python":"3.12"}]' || '[{"os":"ubuntu-22.04","python":"3.10"},{"os":"ubuntu-22.04","python":"3.12"},{"os":"windows-latest","python":"3.12"},{"os":"macos-14","python":"3.12"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Select conservative PR scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: python scripts/ci/test_scope.py
      - name: Install dependencies
        run: python -m pip install ".[dev,a2a,mcp,scientific]"
      - name: Provision real OpenBao software reference
        if: steps.scope.outputs.scope == 'full' && matrix.os == 'ubuntu-22.04' && matrix.python == '3.12'
        env:
          OPENBAO_REFERENCE_IMAGE: openbao/openbao@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
        run: |
          docker pull "$OPENBAO_REFERENCE_IMAGE"
          echo "APEIR_OPENBAO_TEST_IMAGE=$OPENBAO_REFERENCE_IMAGE" >> "$GITHUB_ENV"
      - name: Provision real OPA software reference
        if: steps.scope.outputs.scope == 'full' && matrix.os == 'ubuntu-22.04' && matrix.python == '3.12'
        env:
          OPA_REFERENCE_IMAGE: openpolicyagent/opa@sha256:4675ab04ad1627f74741d2d9c5142698c79e18b7b09f192587d31d6dba20838e
        run: |
          docker pull "$OPA_REFERENCE_IMAGE"
          echo "APEIR_OPA_TEST_IMAGE=$OPA_REFERENCE_IMAGE" >> "$GITHUB_ENV"
      - name: Full repository regression
        if: steps.scope.outputs.scope == 'full'
        run: python -m pytest --tb=short --timeout=60
      - name: Documentation and release consistency regression
        if: steps.scope.outputs.scope == 'documentation'
        run: |
          python -m pytest -q tests/repository tests/test_rc_validation.py::TestDocumentation tests/test_productization_integration.py::TestDocFilesExist
          python scripts/markdown_link_check.py
          python scripts/ci/verify_release_versions.py
      - name: Verify collection floor
        run: >-
          python -c "import re, subprocess, sys;
          p = subprocess.run([sys.executable, '-m', 'pytest', 'tests/', '--collect-only', '-q'], capture_output=True, text=True);
          print(p.stdout);
          m = re.search(r'(\d+) tests collected', p.stdout);
          raise SystemExit(0 if p.returncode == 0 and m and int(m.group(1)) >= 2452 else 1)"
  core-gate:
    # A skipped check also satisfies GitHub protection. Give diagnostic skips a
    # different context so they cannot replace the required Core gate evidence.
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic != 'none' && 'Core qualification not selected (diagnostic only)' || 'Core gate' }}
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.diagnostic == 'none')
    needs: [python-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected platform
        env:
          RESULT: ${{ needs.python-tests.result }}
        run: test "$RESULT" = success
  windows-skill-http-diagnostic:
    name: Windows Governance diagnostic (not Core qualification)
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic != 'none'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match Core's initialization failure or the earlier Multi-Arch HTTP case.
          python-version: ${{ inputs.diagnostic == 'windows-governance' && '3.12' || '3.11' }}
          cache: pip
      - name: Install matching Tier 1 dependencies
        run: python -m pip install ".[tier1,dev,a2a,mcp]"
      - name: Exercise original owned HTTP and TLS paths
        if: inputs.diagnostic == 'windows-skill-http'
        env:
          APEIR_SKILL_HTTP_DIAGNOSTIC: '1'
        run: python -m pytest -q tests/governance/test_sqlite_connection_lifecycle.py tests/control_plane/test_remote_skill_center.py --tb=short --timeout=60 -rA
      - name: Exercise original Governance initialization and identity failures
        if: inputs.diagnostic == 'windows-governance'
        run: python -m pytest -q tests/governance/test_sqlite_connection_lifecycle.py tests/control_plane/test_human_sessions.py tests/context/test_guard_admission.py --tb=short --timeout=60 -rA
      - name: Governance and Control Plane regression after focused qualification
        if: inputs.diagnostic == 'windows-governance'
        env:
          APEIR_SKILL_HTTP_DIAGNOSTIC: '1'
        run: python -m pytest -q tests/governance tests/control_plane --tb=short --timeout=60 -rA
