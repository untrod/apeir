name: Core CI
on:
  push:
    branches: [main, 'release/*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Optional investigation; never qualifies the Core gate
        type: choice
        default: none
        options: [none, windows-skill-http, windows-governance, windows-process-session, windows-relay-recovery, windows-kernel-source, windows-runtime-sidecar]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.diagnostic || 'none' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  python-tests:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic != 'none' && 'Full regression not selected (diagnostic only)' || format('Python Tests ({0}, Python {1})', matrix.os, matrix.python) }}
    if: github.event_name != 'workflow_dispatch' || inputs.diagnostic == 'none'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: '3.10' }
          - { os: ubuntu-22.04, python: '3.12' }
          - { os: windows-latest, python: '3.12' }
          - { os: macos-14, python: '3.12' }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Select conservative PR scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: python scripts/ci/test_scope.py
      - name: Install dependencies
        run: python -m pip install ".[dev,a2a,mcp,scientific]"
      - name: Provision real OpenBao software reference
        if: steps.scope.outputs.scope == 'full' && matrix.os == 'ubuntu-22.04' && matrix.python == '3.12'
        env:
          OPENBAO_REFERENCE_IMAGE: openbao/openbao@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
        run: |
          docker pull "$OPENBAO_REFERENCE_IMAGE"
          echo "APEIR_OPENBAO_TEST_IMAGE=$OPENBAO_REFERENCE_IMAGE" >> "$GITHUB_ENV"
      - name: Provision real OPA software reference
        if: steps.scope.outputs.scope == 'full' && matrix.os == 'ubuntu-22.04' && matrix.python == '3.12'
        env:
          OPA_REFERENCE_IMAGE: openpolicyagent/opa@sha256:4675ab04ad1627f74741d2d9c5142698c79e18b7b09f192587d31d6dba20838e
        run: |
          docker pull "$OPA_REFERENCE_IMAGE"
          echo "APEIR_OPA_TEST_IMAGE=$OPA_REFERENCE_IMAGE" >> "$GITHUB_ENV"
      - name: Full repository regression
        if: steps.scope.outputs.scope == 'full'
        run: python -m pytest --tb=short --timeout=60
      - name: Documentation and release consistency regression
        if: steps.scope.outputs.scope == 'documentation'
        run: |
          python -m pytest -q tests/repository tests/test_rc_validation.py::TestDocumentation tests/test_productization_integration.py::TestDocFilesExist
          python scripts/markdown_link_check.py
          python scripts/ci/verify_release_versions.py
      - name: Verify collection floor
        run: >-
          python -c "import re, subprocess, sys;
          p = subprocess.run([sys.executable, '-m', 'pytest', 'tests/', '--collect-only', '-q'], capture_output=True, text=True);
          print(p.stdout);
          m = re.search(r'(\d+) tests collected', p.stdout);
          raise SystemExit(0 if p.returncode == 0 and m and int(m.group(1)) >= 2452 else 1)"
  core-gate:
    # A skipped check also satisfies GitHub protection. Give diagnostic skips a
    # different context so they cannot replace the required Core gate evidence.
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic != 'none' && 'Core qualification not selected (diagnostic only)' || 'Core gate' }}
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.diagnostic == 'none')
    needs: [python-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected platform
        env:
          RESULT: ${{ needs.python-tests.result }}
        run: test "$RESULT" = success
  windows-skill-http-diagnostic:
    name: ${{ inputs.diagnostic == 'windows-runtime-sidecar' && 'Windows Runtime version diagnostic (not native qualification)' || inputs.diagnostic == 'windows-kernel-source' && 'Windows Kernel source diagnostic (not Core qualification)' || inputs.diagnostic == 'windows-process-session' && 'Windows ProcessSession diagnostic (not Core qualification)' || inputs.diagnostic == 'windows-relay-recovery' && 'Windows Relay recovery diagnostic (not Core qualification)' || 'Windows Governance diagnostic (not Core qualification)' }}
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic != 'none'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match Core's initialization failure or the earlier Multi-Arch HTTP case.
          python-version: ${{ inputs.diagnostic != 'windows-skill-http' && '3.12' || '3.11' }}
          cache: pip
      - name: Install matching Tier 1 dependencies
        run: python -m pip install ".[tier1,dev,a2a,mcp]"
      - name: Reject an unapproved Runtime binary diagnostic
        if: inputs.diagnostic == 'windows-runtime-sidecar' && vars.APEIR_BINARY_RELEASE_ENABLED != 'true'
        run: throw 'Runtime binary diagnostic requires the enabled internal binary gate.'
      - name: Install the existing sidecar build dependencies
        if: inputs.diagnostic == 'windows-runtime-sidecar'
        run: python -m pip install ".[installer-build]"
      - name: Diagnose the actual Runtime EXE version through the maintained specification
        if: inputs.diagnostic == 'windows-runtime-sidecar'
        timeout-minutes: 10
        run: |
          python -m PyInstaller --noconfirm --clean nous-sidecar.spec
          if ($LASTEXITCODE -ne 0) { throw 'Maintained Runtime sidecar build failed.' }
          $expected = (& python -c 'from nous_runtime._version import __version__; print(__version__)').Trim()
          $output = (& .\dist\nous-runtime.exe --version 2>&1 | Out-String).Trim()
          $exitCode = $LASTEXITCODE
          Write-Output $output
          if ($exitCode -ne 0 -or $output -notmatch [regex]::Escape($expected)) {
              throw "Actual Runtime version probe failed with exit code $exitCode."
          }
          $sidecar = (Resolve-Path .\dist\nous-runtime.exe).Path
          $workspace = Join-Path $env:RUNNER_TEMP ('apeir-frozen-status-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $workspace | Out-Null
          Push-Location $workspace
          try {
              & $sidecar --no-intelligence status
              if ($LASTEXITCODE -ne 0) { throw 'Actual model-free Runtime status failed.' }
              # Reuse the full Native probe to expose missing frozen commands
              # before an installer build. This remains diagnostic-only.
              $probe = Join-Path $env:GITHUB_WORKSPACE 'scripts/ci/probe_native_workflow.py'
              $report = Join-Path $workspace 'workflow-cli-diagnostic.json'
              & python -I $probe --sidecar $sidecar --workspace $workspace --report $report
              if ($LASTEXITCODE -ne 0) { throw 'Actual packaged Workflow diagnostic failed.' }
              Get-Content -LiteralPath $report
          } finally {
              Pop-Location
              Remove-Item -LiteralPath $workspace -Recurse -Force
          }
      - uses: actions/checkout@v4
        if: inputs.diagnostic == 'windows-kernel-source'
        with:
          repository: untrod/apeir-kernel
          ref: 87fd1b2ff28ef14ab1a515a58162592b452fda2e
          path: kernel-source-validation
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.diagnostic == 'windows-kernel-source'
      - name: Validate the isolated wrapper with real PowerShell
        if: inputs.diagnostic == 'windows-kernel-source'
        run: python -m pytest -q tests/repository/test_kernel_test_environment.py --tb=short --timeout=60 -rA
      - name: Run the unchanged frozen Kernel test entry with Distribution installed
        if: inputs.diagnostic == 'windows-kernel-source'
        timeout-minutes: 30
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          $powerShellExecutable = (Get-Process -Id $PID).Path
          python scripts/ci/run_kernel_source_tests.py --kernel-root kernel-source-validation --powershell $powerShellExecutable
          if ($LASTEXITCODE -ne 0) { throw 'Original frozen Kernel source qualification failed.' }
      - name: Exercise original process controls, startup and fail-closed recovery
        if: inputs.diagnostic == 'windows-process-session'
        timeout-minutes: 5
        run: python -m pytest -q tests/tools/test_process_session.py tests/tools/test_process_session_ack.py tests/tools/test_process_session_host_read.py tests/tools/test_process_session_startup.py tests/tools/test_process_session_reaping.py tests/repository/test_kernel_test_environment.py --tb=short --timeout=60 -rA
      - name: Exercise original owned HTTP and TLS paths
        if: inputs.diagnostic == 'windows-skill-http'
        env:
          APEIR_SKILL_HTTP_DIAGNOSTIC: '1'
        run: python -m pytest -q tests/governance/test_sqlite_connection_lifecycle.py tests/control_plane/test_remote_skill_center.py --tb=short --timeout=60 -rA
      - name: Exercise original Relay journals and actual Windows read conflicts
        if: inputs.diagnostic == 'windows-relay-recovery'
        timeout-minutes: 5
        run: python -m pytest -q tests/node_runtime/test_relay_reconciliation.py --tb=short --timeout=60 -rA
      - name: Exercise original Governance initialization and identity failures
        if: inputs.diagnostic == 'windows-governance'
        run: python -m pytest -q tests/governance/test_sqlite_connection_lifecycle.py tests/control_plane/test_human_sessions.py tests/context/test_guard_admission.py --tb=short --timeout=60 -rA
      - name: Governance and Control Plane regression after focused qualification
        if: inputs.diagnostic == 'windows-governance'
        env:
          APEIR_SKILL_HTTP_DIAGNOSTIC: '1'
        run: python -m pytest -q tests/governance tests/control_plane --tb=short --timeout=60 -rA
