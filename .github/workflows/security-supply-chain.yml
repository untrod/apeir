name: Security and Supply Chain
on:
  push:
    branches: [main, 'feature/*', 'fix/*', 'docs/*', 'security/*', 'provider/*', 'platform/*', 'hardware/*', 'research/*', 'release/*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install ".[dev]"
      - name: Ruff and compile
        run: |
          ruff check nous_runtime tests scripts integrations sdk
          python -m compileall -q nous_runtime sdk/provider/python
      - name: Formatting of changed Python sources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python - <<'PY'
          import os, subprocess
          base = os.environ.get('BASE_SHA', '')
          if not base or set(base) == {'0'}:
              base = 'HEAD^'
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=ACMR', base, 'HEAD'], text=True).splitlines()
          sources = [p for p in paths if p.endswith('.py')]
          if sources:
              subprocess.run(['ruff', 'format', '--check', *sources], check=True)
          PY
      - name: Documentation, identity and security
        run: |
          python scripts/document_hygiene_audit.py
          python scripts/markdown_link_check.py
          python scripts/comment_quality_audit.py
          python scripts/repository_identity_audit.py
          python scripts/git_metadata_audit.py
          python scripts/security_scan.py
          python scripts/ci/verify_release_versions.py
          git diff --check
      - name: Component lock contract (not native bytes)
        run: python -m pytest -q tests/repository/test_kernel_component_lock.py
      - name: Native qualification status
        run: |
          echo 'Native component hash verification: BLOCKED / NOT RUN in source-only CI. Locked binaries are not staged.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A passing lock contract is not a binary integrity claim. Release preflight runs the actual verifier.' >> "$GITHUB_STEP_SUMMARY"
