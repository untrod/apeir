# APEIR Distribution desktop release build and validation.
# Platform jobs build their own target-native Runtime sidecar.

name: Desktop CI

on:
  push:
    branches: [main, 'release/*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_locked_kernel:
        description: 'Diagnostic only: rebuild frozen Windows Kernel and compare original hashes (no release)'
        type: boolean
        default: false
      qualify_kernel_candidate:
        description: 'Run real native smoke and retain unapproved candidates for lock review; requires rebuild_locked_kernel'
        type: boolean
        default: false
      native_target:
        description: 'Explicit native target; all binary gates and platform qualification still apply'
        type: choice
        default: none
        options: [none, windows-x64, windows-arm64, linux-x64, macos-arm64]
      approved_kernel_run_id:
        description: 'Reviewed same-repository candidate producer run (Windows x64 only)'
        type: string
        default: ''
      approved_kernel_artifact_id:
        description: 'Exact reviewed candidate artifact ID; never a moving artifact name'
        type: string
        default: ''
      approved_kernel_zip_sha256:
        description: 'Maintainer-reviewed artifact ZIP SHA-256; cannot override the component lock'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  locked-kernel-rebuild:
    name: Locked Kernel rebuild diagnostic (not installation acceptance)
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild_locked_kernel == true
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        attempt: ${{ fromJSON(inputs.qualify_kernel_candidate && '[1,2]' || '[1]') }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: distribution
      - uses: actions/checkout@v4
        id: kernel
        with:
          repository: untrod/apeir-kernel
          ref: 87fd1b2ff28ef14ab1a515a58162592b452fda2e
          persist-credentials: false
          path: kernel-rebuild-source
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: x86_64-pc-windows-msvc
      - name: Record build environment and exact source
        shell: pwsh
        env:
          QUALIFY_CANDIDATE: ${{ inputs.qualify_kernel_candidate }}
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'kernel-rebuild-evidence'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          if ($env:QUALIFY_CANDIDATE -eq 'true') {
            if ($env:RUSTFLAGS) { throw 'Unexpected compiler flags in candidate baseline' }
            # MSVC timestamps/debug IDs varied in the first recorded clean pair.
            # Rebuild deterministically, never edit or normalize the EXE bytes.
            $env:RUSTFLAGS = '-C link-arg=/Brepro'
            "RUSTFLAGS=$env:RUSTFLAGS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          rustc +1.99.1 -vV | Out-File "$evidence/toolchain.txt"
          cargo +1.99.1 -V | Out-File -Append "$evidence/toolchain.txt"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | Format-List | Out-File -Append "$evidence/toolchain.txt"
          & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -format json | Out-File "$evidence/visual-studio.json"
          git -C distribution rev-parse HEAD | Out-File "$evidence/distribution-sha.txt"
          git -C kernel-rebuild-source rev-parse HEAD | Out-File "$evidence/kernel-sha.txt"
          $preflight = & ./distribution/scripts/ci/windows_native_preflight.ps1 -Target x86_64-pc-windows-msvc
          if (-not $preflight.ready) { throw 'Windows native build prerequisites unavailable' }
          $environment = [ordered]@{
            operating_system = (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture)
            runner_image = $env:ImageOS
            runner_image_version = $env:ImageVersion
            rust = (& rustc +1.99.1 -vV) -join "`n"
            cargo = (& cargo +1.99.1 -V)
            msvc = (Get-Item -LiteralPath $preflight.cl_path).VersionInfo.ProductVersion
            windows_sdk = $preflight.kernel32_lib
            cargo_lock_sha256 = (Get-FileHash kernel-rebuild-source/Cargo.lock -Algorithm SHA256).Hash
            component_lock_sha256 = (Get-FileHash distribution/runtime-components.lock.json -Algorithm SHA256).Hash
            build_parameters = 'cargo +1.99.1 build --release --locked --target x86_64-pc-windows-msvc -p nousd --bin nousd -p nous-provider-worker --bin nous-provider-worker'
            environment = @{ CARGO_BUILD_JOBS = $env:CARGO_BUILD_JOBS; CARGO_TERM_COLOR = $env:CARGO_TERM_COLOR; RUSTFLAGS = $env:RUSTFLAGS; SOURCE_DATE_EPOCH = $env:SOURCE_DATE_EPOCH }
          }
          $environment | ConvertTo-Json -Depth 6 | Out-File "$evidence/build-environment.json"
          Copy-Item kernel-rebuild-source/Cargo.lock "$evidence/Cargo.lock"
      - name: Build frozen components without modifying source or lock
        id: kernel-build
        working-directory: kernel-rebuild-source
        shell: pwsh
        run: |
          cargo +1.99.1 build --release --locked --target x86_64-pc-windows-msvc -p nousd --bin nousd -p nous-provider-worker --bin nous-provider-worker 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/kernel-rebuild-evidence/cargo-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independently compare both PE files with unchanged component lock
        id: original-lock
        if: always() && steps.kernel.outcome == 'success'
        shell: pwsh
        run: |
          python distribution/scripts/ci/verify_kernel_components.py --repo-root distribution --kernel-root kernel-rebuild-source --candidate-root kernel-rebuild-source/target/x86_64-pc-windows-msvc/release --report "$env:RUNNER_TEMP/kernel-rebuild-evidence/component-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Admit only clean, frozen-source x64 candidates to compatibility tests
        id: candidate-admission
        if: always() && inputs.qualify_kernel_candidate == true && steps.kernel-build.outcome == 'success'
        shell: pwsh
        run: |
          $report = Get-Content "$env:RUNNER_TEMP/kernel-rebuild-evidence/component-report.json" -Raw | ConvertFrom-Json
          if ($report.actual_revision -ne '87fd1b2ff28ef14ab1a515a58162592b452fda2e' -or -not $report.tracked_source_clean -or $report.artifacts.Count -ne 2) { throw 'Candidate source is not the frozen clean Kernel' }
          foreach ($item in $report.artifacts) {
            if ($item.pe_machine -ne '0x8664' -or -not $item.sha256 -or @($item.errors | Where-Object { $_ -ne 'hash mismatch' }).Count) { throw 'Candidate has a non-hash integrity failure' }
          }
          $root = "$env:RUNNER_TEMP/unapproved-kernel-candidate"
          New-Item -ItemType Directory -Force "$root/desktop/src-tauri/binaries" | Out-Null
          foreach ($name in @('nousd', 'nous-provider-worker')) {
            Copy-Item "kernel-rebuild-source/target/x86_64-pc-windows-msvc/release/$name.exe" "$root/desktop/src-tauri/binaries/$name-x86_64-pc-windows-msvc.exe"
          }
      - name: Build the existing Runtime sidecar for candidate compatibility only
        id: candidate-runtime
        if: always() && inputs.qualify_kernel_candidate == true && steps.candidate-admission.outcome == 'success'
        working-directory: distribution
        shell: pwsh
        run: |
          python -m pip install ".[installer-build]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Out-File "$env:RUNNER_TEMP/kernel-rebuild-evidence/python-dependencies.txt"
          python -m PyInstaller --noconfirm --clean nous-sidecar.spec 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/kernel-rebuild-evidence/runtime-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist/nous-runtime.exe "$env:RUNNER_TEMP/unapproved-kernel-candidate/nous-runtime.exe"
      - name: Exercise actual candidate processes through the existing Native Sidecar Smoke
        id: candidate-smoke
        if: always() && inputs.qualify_kernel_candidate == true && steps.candidate-runtime.outcome == 'success'
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP/unapproved-kernel-candidate"
          $smoke = & ./distribution/scripts/ci/verify_windows_native_sidecars.ps1 -SidecarPath "$root/nous-runtime.exe" -KernelPath "$root/desktop/src-tauri/binaries/nousd-x86_64-pc-windows-msvc.exe" -ProviderWorkerPath "$root/desktop/src-tauri/binaries/nous-provider-worker-x86_64-pc-windows-msvc.exe" -EvidenceDirectory $root
          $smoke | ConvertTo-Json -Depth 12 | Out-File "$root/native-smoke.json"
      - name: Record unapproved candidate inputs, signatures, dependencies and hashes
        id: candidate-record
        if: always() && inputs.qualify_kernel_candidate == true && steps.candidate-runtime.outcome == 'success'
        shell: pwsh
        env:
          NATIVE_SMOKE_OUTCOME: ${{ steps.candidate-smoke.outcome }}
          BUILD_ATTEMPT: ${{ matrix.attempt }}
        run: |
          $root = "$env:RUNNER_TEMP/unapproved-kernel-candidate"
          Copy-Item "$env:RUNNER_TEMP/kernel-rebuild-evidence/component-report.json" "$root/original-lock-report.json"
          Copy-Item "$env:RUNNER_TEMP/kernel-rebuild-evidence/build-environment.json" "$root/build-environment.json"
          Copy-Item "$env:RUNNER_TEMP/kernel-rebuild-evidence/python-dependencies.txt" $root
          $preflight = & ./distribution/scripts/ci/windows_native_preflight.ps1 -Target x86_64-pc-windows-msvc
          $dumpbin = Join-Path (Split-Path $preflight.link_path) 'dumpbin.exe'
          $files = foreach ($relative in @('desktop/src-tauri/binaries/nousd-x86_64-pc-windows-msvc.exe', 'desktop/src-tauri/binaries/nous-provider-worker-x86_64-pc-windows-msvc.exe', 'nous-runtime.exe')) {
            $path = Join-Path $root $relative
            & $dumpbin /DEPENDENTS $path | Out-File "$root/$([IO.Path]::GetFileNameWithoutExtension($path))-dependencies.txt"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            @{ path = $relative; sha256 = (Get-FileHash $path -Algorithm SHA256).Hash; size_bytes = (Get-Item $path).Length; signature_status = (Get-AuthenticodeSignature $path).Status.ToString() }
          }
          $manifest = [ordered]@{
            purpose = 'UNAPPROVED_NATIVE_CANDIDATE; not an installer or release'
            distribution_revision = (& git -C distribution rev-parse HEAD).Trim()
            kernel_revision = (& git -C kernel-rebuild-source rev-parse HEAD).Trim()
            source_build = 'PASS'
            native_smoke = $env:NATIVE_SMOKE_OUTCOME
            native_component_integrity = (Get-Content "$root/original-lock-report.json" -Raw | ConvertFrom-Json).status
            component_lock_migration_approved = $false
            installation_acceptance = 'NOT_RUN'
            signing_and_release = 'NOT_RUN'
            github_repository = $env:GITHUB_REPOSITORY
            github_run_id = $env:GITHUB_RUN_ID
            github_run_attempt = $env:GITHUB_RUN_ATTEMPT
            independent_build_attempt = $env:BUILD_ATTEMPT
            files = @($files)
          }
          $manifest | ConvertTo-Json -Depth 8 | Out-File "$root/candidate-manifest.json"
          Get-ChildItem $root -File -Recurse | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $([IO.Path]::GetRelativePath($root, $_.FullName) -replace '\\','/')" } | Out-File "$root/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.qualify_kernel_candidate == true && steps.candidate-record.outcome == 'success'
        with:
          name: unapproved-kernel-candidate-windows-x64-${{ matrix.attempt }}
          path: ${{ runner.temp }}/unapproved-kernel-candidate/
          retention-days: 14
          if-no-files-found: error
      - name: Retain diagnostic evidence, never publish mismatched executables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.qualify_kernel_candidate && format('locked-kernel-rebuild-diagnostic-{0}', matrix.attempt) || 'locked-kernel-rebuild-diagnostic' }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/kernel-rebuild-evidence/

  compare-kernel-candidates:
    name: Compare unapproved native candidate builds (not lock approval)
    if: always() && github.event_name == 'workflow_dispatch' && inputs.qualify_kernel_candidate == true && inputs.rebuild_locked_kernel == true
    needs: [locked-kernel-rebuild]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: unapproved-kernel-candidate-windows-x64-*
          path: candidates
      - name: Verify actual candidate bytes and compare the two recorded environments
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          result = {"purpose": "two clean native candidate builds; no component-lock or release approval", "status": "FAIL"}
          try:
              roots = sorted(Path("candidates").glob("unapproved-kernel-candidate-windows-x64-*"))
              assert len(roots) == 2
              manifests, environments, native_hashes = [], [], []
              for root in roots:
                  manifest = json.loads((root / "candidate-manifest.json").read_text(encoding="utf-8-sig"))
                  assert manifest["kernel_revision"] == "87fd1b2ff28ef14ab1a515a58162592b452fda2e"
                  assert manifest["native_smoke"] == "success"
                  assert manifest["component_lock_migration_approved"] is False
                  hashes = {}
                  for item in manifest["files"]:
                      path = Path(item["path"])
                      assert not path.is_absolute() and ".." not in path.parts
                      assert hashlib.sha256((root / path).read_bytes()).hexdigest().upper() == item["sha256"]
                      if path.name.startswith(("nousd-", "nous-provider-worker-")):
                          hashes[path.name] = item["sha256"]
                  assert len(hashes) == 2
                  native_hashes.append(hashes)
                  manifests.append(manifest)
                  environments.append(json.loads((root / "build-environment.json").read_text(encoding="utf-8-sig")))
              result.update(kernel_component_hashes=native_hashes, environments_equal=environments[0] == environments[1], kernel_bytes_equal=native_hashes[0] == native_hashes[1])
              assert manifests[0]["distribution_revision"] == manifests[1]["distribution_revision"]
              assert result["environments_equal"] and result["kernel_bytes_equal"]
              result["status"] = "MATCH_IN_TWO_RECORDED_ENVIRONMENTS"
          finally:
              Path("candidate-comparison.json").write_text(json.dumps(result, indent=2) + "\n")
              print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-candidate-build-comparison
          path: candidate-comparison.json
          retention-days: 14
          if-no-files-found: error

  # Frontend Validation
  frontend-tests:
    name: Frontend Build Validation
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject incomplete candidate qualification inputs
        if: github.event_name == 'workflow_dispatch' && ((inputs.qualify_kernel_candidate == true && inputs.rebuild_locked_kernel != true) || (inputs.rebuild_locked_kernel == true && inputs.native_target != 'none'))
        working-directory: .
        run: |
          echo 'Candidate qualification requires rebuild_locked_kernel=true and native_target=none; native packaging is a separate approved run'
          exit 1
      - name: Reject native requests while the release gate is disabled
        if: github.event_name == 'workflow_dispatch' && inputs.native_target != 'none' && vars.APEIR_BINARY_RELEASE_ENABLED != 'true'
        working-directory: .
        run: |
          echo 'BLOCKED: APEIR_BINARY_RELEASE_ENABLED requires maintainer authorization and qualified native inputs'
          exit 1
      - name: Select conservative PR scope
        id: scope
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: python scripts/ci/test_scope.py
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.scope == 'full'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        if: steps.scope.outputs.scope == 'full'
      - run: npm audit --audit-level=high
        if: steps.scope.outputs.scope == 'full'
      - run: npm run lint
        if: steps.scope.outputs.scope == 'full'
      - run: npm test
        if: steps.scope.outputs.scope == 'full'
      - run: npm run typecheck
        if: steps.scope.outputs.scope == 'full'
      - run: npm run build
        if: steps.scope.outputs.scope == 'full'
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.scope == 'full'
        with:
          python-version: '3.12'
      - name: Install the existing Runtime for source Studio integration
        if: steps.scope.outputs.scope == 'full'
        working-directory: .
        run: python -m pip install .
      - name: Install sandboxed Chromium test prerequisites
        if: steps.scope.outputs.scope == 'full'
        run: npx playwright install --with-deps chromium
      - name: Exercise source Studio against two real model-disabled Runtime processes
        if: steps.scope.outputs.scope == 'full'
        run: npm run test:e2e
      - name: Retain the matching source Studio frontend, integrity and canonical guide
        if: steps.scope.outputs.scope == 'full'
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re, shutil
          from pathlib import Path
          from urllib.parse import urljoin
          root = Path('../artifacts/studio-source-frontend')
          root.mkdir(parents=True, exist_ok=True)
          shutil.copytree('dist', root / 'app', dirs_exist_ok=True)
          for name in ('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'):
              shutil.copyfile(Path('..') / name, root / name)
          shutil.copyfile('package-lock.json', root / 'desktop-package-lock.json')
          revision = os.environ['SOURCE_REVISION']
          canonical = f'https://github.com/untrod/apeir/blob/{revision}/docs/operations/getting-started/QUICK_START.md'
          guide = Path('../docs/operations/getting-started/QUICK_START.md').read_text(encoding='utf-8')
          guide = re.sub(r'(\]\()([^\s)]+)(\))', lambda match: match[1] + urljoin(canonical, match[2]) + match[3], guide)
          (root / 'QUICK_START.md').write_text(f'Canonical guide for this exact source revision: {canonical}\n\n' + guide, encoding='utf-8')
          lock = Path('../runtime-components.lock.json')
          manifest = {
              'distribution_revision': revision,
              'kind': 'Static source-browser Studio frontend; not native Desktop or a release',
              'runtime_requirement': 'Install the Distribution from the same source revision; authenticate to its actual API',
              'validation': 'Frontend unit/type/lint/build and the checked-in model-disabled CLI/HTTP/Chromium integration cases passed in this job',
              'kernel_reference': json.loads(lock.read_text())['components']['nous-kernel']['revision'],
              'component_lock_sha256': hashlib.sha256(lock.read_bytes()).hexdigest(),
              'kernel_binary_integrity': 'NOT_RUN', 'native_installation': 'NOT_RUN', 'real_model': 'NOT_RUN',
              'supply_chain_scope': 'Original package lock and notices retained; not formal release qualification',
          }
          (root / 'source-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          files = sorted(path for path in root.rglob('*') if path.is_file() and path.name != 'SHA256SUMS.txt')
          assert not any(path.suffix in ('.exe', '.db', '.sqlite', '.sqlite3', '.pem', '.key') for path in files)
          (root / 'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}\n' for path in files), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.scope == 'full'
        with:
          name: apeir-studio-source-frontend-${{ github.sha }}
          path: artifacts/studio-source-frontend/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.scope == 'full'
        with:
          name: studio-source-browser-evidence-${{ github.sha }}
          path: desktop/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Documentation-only validation (required context remains present)
        if: steps.scope.outputs.scope == 'documentation'
        working-directory: .
        run: python scripts/markdown_link_check.py

  source-preview:
    name: Python source preview (not native release)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [frontend-tests]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: source-builder
        with:
          python-version: '3.12'
      - name: Verify versions and build the existing Python package
        run: |
          python scripts/ci/verify_release_versions.py
          python -m pip install build
          python -m build --wheel --outdir artifacts/source-preview
      - name: Select the minimum supported Python for the base-package consumer
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install and exercise the built wheel in isolation
        run: |
          python -m venv "$RUNNER_TEMP/apeir-source-consumer"
          "$RUNNER_TEMP/apeir-source-consumer/bin/python" -m pip install artifacts/source-preview/*.whl
          "$RUNNER_TEMP/apeir-source-consumer/bin/python" -I scripts/ci/verify_source_preview_install.py --report "$RUNNER_TEMP/source-startup.json"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/apeir-source-consumer/bin/python" -I -c "import nous_runtime; from nous_runtime.api.server import create_server; assert 'site-packages' in nous_runtime.__file__; server = create_server('127.0.0.1', 0); server.server_close()"
          "$RUNNER_TEMP/apeir-source-consumer/bin/python" -I "$RUNNER_TEMP/apeir-source-consumer/bin/apeir" version
          "$RUNNER_TEMP/apeir-source-consumer/bin/python" -I "$RUNNER_TEMP/apeir-source-consumer/bin/apeir" demo --workspace "$RUNNER_TEMP/apeir-source-demo" --scenario lost-response --approve-once --json > "$RUNNER_TEMP/source-demo.json"
      - name: Record scoped installed-package evidence
        run: |
          python - <<'PY'
          import json, os, platform
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "source-demo.json").read_text())
          before = result["before_recovery"]
          assert result["execution_scope"] == "runtime-service" and result["kernel_traversed"] is False
          assert result["simulated"] is True
          assert result["work"]["state"] == "COMMITTED" and result["effect_verification"]["verdict"] == "MATCH"
          assert before["receipt"] is None and before["effect_count"] == result["effect_count"] == 1
          report = {
              "source_wheel_installation": "PASS",
              "consumer_python": platform.python_version(),
              "isolated_api_import_bind_and_close": "PASS",
              "simulated_lost_response_recovery": "PASS",
              "execution_scope": result["execution_scope"],
              "kernel_traversed": False,
              "effect_count_before_recovery": before["effect_count"],
              "effect_count_after_recovery": result["effect_count"],
              "observation_count": len(result["observations"]),
              "artifact_integrity_checks": result["artifact_integrity_checked"],
              "real_model_and_physical_acceptance": "NOT_RUN",
              "native_installation": "NOT_RUN",
          }
          report.update(json.loads((Path(os.environ["RUNNER_TEMP"]) / "source-startup.json").read_text()))
          Path("artifacts/source-preview/source-preview-validation.json").write_text(json.dumps(report, indent=2) + "\n")
          PY
      - name: Record measured wheel hashes and qualification limits
        env:
          SOURCE_REVISION: ${{ github.sha }}
          BUILD_PYTHON_VERSION: ${{ steps.source-builder.outputs.python-version }}
        run: |
          python - <<'PY'
          import email, hashlib, json, os, platform, re, zipfile
          from pathlib import Path
          from urllib.parse import urljoin
          root = Path("artifacts/source-preview")
          wheels = sorted(root.glob("*.whl"))
          assert len(wheels) == 1, "Expected the existing Distribution wheel only"
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as archive:
              assert not any(name.endswith((".exe", ".db", ".sqlite", ".sqlite3", ".jsonl", ".pem", ".key")) or "/.nous/" in name or "/.git/" in name for name in archive.namelist()), "Runtime state or native binary entered source wheel"
              metadata_names = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              assert len(metadata_names) == 1
              metadata = email.message_from_bytes(archive.read(metadata_names[0]))
          digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
          lock = Path("runtime-components.lock.json")
          canonical = "https://github.com/untrod/apeir/blob/" + os.environ["SOURCE_REVISION"] + "/docs/operations/getting-started/QUICK_START.md"
          guide = Path("docs/operations/getting-started/QUICK_START.md").read_text(encoding="utf-8")
          guide = re.sub(r"(\]\()([^\s)]+)(\))", lambda match: match[1] + urljoin(canonical, match[2]) + match[3], guide)
          guide_path = root / "QUICK_START.md"
          guide_path.write_text("Canonical instructions for this exact source revision: " + canonical + "\n\n" + guide, encoding="utf-8")
          manifest = {
              "distribution_revision": os.environ["SOURCE_REVISION"],
              "distribution_name": metadata["Name"],
              "distribution_version": metadata["Version"],
              "python": platform.python_version(),
              "build_python": os.environ["BUILD_PYTHON_VERSION"],
              "kind": "Python source preview; not native Desktop or a verified release",
              "verified_release": False,
              "kernel_reference": json.loads(lock.read_text())["components"]["nous-kernel"]["revision"],
              "component_lock_sha256": hashlib.sha256(lock.read_bytes()).hexdigest(),
              "native_binary_hash_verification": "NOT_RUN",
              "native_installation": "NOT_RUN",
              "signing_and_release_qualification": "NOT_RUN",
              "wheel": {"filename": wheel.name, "sha256": digest},
              "validation_report": "source-preview-validation.json",
              "usage_instructions": {"filename": guide_path.name, "canonical_url": canonical, "sha256": hashlib.sha256(guide_path.read_bytes()).hexdigest()},
          }
          (root / "source-preview-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          (root / "SHA256SUMS.txt").write_text("".join(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n" for path in sorted(root.iterdir()) if path.is_file() and path.name != "SHA256SUMS.txt"))
          PY
          echo 'Python source package only. No EXE/NSIS, native hash, installation, signing or production release qualification is claimed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: apeir-python-source-preview-${{ github.sha }}
          path: artifacts/source-preview/
          if-no-files-found: error
          retention-days: 7

  # Windows x86_64 Build
  build-windows-x64:
    if: github.event_name == 'workflow_dispatch' && vars.APEIR_BINARY_RELEASE_ENABLED == 'true' && inputs.native_target == 'windows-x64'
    name: Build Windows x86_64
    needs: [frontend-tests]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: distribution
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: untrod/apeir-kernel
          ref: 87fd1b2ff28ef14ab1a515a58162592b452fda2e
          path: kernel-native-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: x86_64-pc-windows-msvc
      - name: Download only the exact reviewed same-repository candidate archive
        shell: python {0}
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_RUN_ID: ${{ inputs.approved_kernel_run_id }}
          APPROVED_ARTIFACT_ID: ${{ inputs.approved_kernel_artifact_id }}
          APPROVED_ZIP_SHA256: ${{ inputs.approved_kernel_zip_sha256 }}
        run: |
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          run_id, artifact_id, expected = (os.environ[key] for key in ("APPROVED_RUN_ID", "APPROVED_ARTIFACT_ID", "APPROVED_ZIP_SHA256"))
          assert re.fullmatch(r"[1-9][0-9]*", run_id) and re.fullmatch(r"[1-9][0-9]*", artifact_id), "Exact reviewed run/artifact IDs are required"
          assert re.fullmatch(r"[0-9A-Fa-f]{64}", expected), "Reviewed ZIP digest is required"
          def api(path):
              result = subprocess.run(["gh", "api", "repos/untrod/apeir/" + path], capture_output=True, text=True)
              assert result.returncode == 0, "Reviewed artifact metadata is unavailable"
              return json.loads(result.stdout)
          producer = api("actions/runs/" + run_id)
          artifact = api("actions/artifacts/" + artifact_id)
          assert producer["head_repository"]["full_name"] == "untrod/apeir"
          assert producer["path"] == ".github/workflows/desktop-build.yml" and producer["event"] == "workflow_dispatch"
          assert producer["status"] == "completed" and producer["conclusion"] in ("success", "failure")
          revision = producer["head_sha"]
          assert re.fullmatch(r"[0-9a-f]{40}", revision)
          subprocess.run(["git", "-C", "distribution", "merge-base", "--is-ancestor", revision, "HEAD"], check=True)
          assert artifact["workflow_run"]["id"] == int(run_id) and artifact["workflow_run"]["head_sha"] == revision
          assert not artifact["expired"] and artifact["size_in_bytes"] <= 256 * 1024 * 1024
          assert re.fullmatch(r"unapproved-kernel-candidate-windows-x64-[12]", artifact["name"])
          assert artifact.get("digest", "").lower() == "sha256:" + expected.lower()
          archive = Path(os.environ["RUNNER_TEMP"]) / "reviewed-kernel.zip"
          with archive.open("wb") as stream:
              result = subprocess.run(["gh", "api", "repos/untrod/apeir/actions/artifacts/" + artifact_id + "/zip"], stdout=stream, stderr=subprocess.PIPE)
          assert result.returncode == 0, "Reviewed artifact download failed"
          assert archive.stat().st_size <= 256 * 1024 * 1024
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected.lower()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("APPROVED_PRODUCER_REVISION=" + revision + "\n")
          Path(os.environ["RUNNER_TEMP"], "reviewed-input-provenance.json").write_text(json.dumps({"producer_revision": revision, "producer_run": int(run_id), "artifact_id": int(artifact_id), "archive_sha256": expected.lower()}, indent=2))
      - name: Admit the downloaded bytes through the unchanged maintained lock
        shell: pwsh
        env:
          APPROVED_ZIP_SHA256: ${{ inputs.approved_kernel_zip_sha256 }}
        run: |
          python distribution/scripts/ci/verify_kernel_components.py --repo-root distribution --kernel-root kernel-native-source --artifact-zip "$env:RUNNER_TEMP/reviewed-kernel.zip" --artifact-sha256 $env:APPROVED_ZIP_SHA256 --artifact-source-revision $env:APPROVED_PRODUCER_REVISION --artifact-output "$env:RUNNER_TEMP/approved-native-inputs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install existing full validation and installer build dependencies
        working-directory: distribution
        run: python -m pip install ".[dev,a2a,mcp,scientific,installer-build]"
      - name: Install frontend build dependencies
        working-directory: distribution/desktop
        run: npm ci
      - name: Build Portable and NSIS together through the official full launcher entry
        shell: pwsh
        working-directory: distribution
        run: |
          & ./scripts/build-windows-x64-launcher.ps1 -RepoRoot (Resolve-Path .).Path -KernelRoot (Resolve-Path ../kernel-native-source).Path -KernelArtifactDirectory "$env:RUNNER_TEMP/approved-native-inputs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:RUNNER_TEMP/reviewed-input-provenance.json" artifacts/windows-x64/

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: windows-x64-native-development-build
          if-no-files-found: error
          path: distribution/artifacts/windows-x64/

  # Windows ARM64 release candidate build
  build-windows-arm64:
    if: github.event_name == 'workflow_dispatch' && vars.APEIR_BINARY_RELEASE_ENABLED == 'true' && inputs.native_target == 'windows-arm64'
    name: Build Windows ARM64
    needs: [frontend-tests]
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Verify release candidate metadata
        run: python scripts/ci/verify_release_versions.py

      - name: Verify native locked Kernel bytes before packaging
        run: python scripts/ci/verify_kernel_components.py --repo-root .

      - name: Build embedded ARM64 Runtime sidecar
        shell: pwsh
        run: |
          python -m pip install ".[installer-build]"
          python -m PyInstaller --noconfirm --clean nous-sidecar.spec
          New-Item -ItemType Directory -Force desktop/src-tauri/binaries | Out-Null
          Copy-Item dist/nous-runtime.exe desktop/src-tauri/binaries/nous-runtime-aarch64-pc-windows-msvc.exe
      - name: Verify locked ARM64 Kernel sidecars are staged
        run: python scripts/ci/verify_kernel_components.py --repo-root .

      - name: Verify ARM64 Runtime and Kernel lifecycle and authentication
        shell: pwsh
        run: >-
          ./scripts/ci/verify_windows_arm64_sidecar.ps1
          -SidecarPath ./desktop/src-tauri/binaries/nous-runtime-aarch64-pc-windows-msvc.exe
          -KernelPath ./desktop/src-tauri/binaries/nousd-aarch64-pc-windows-msvc.exe
          -ProviderWorkerPath ./desktop/src-tauri/binaries/nous-provider-worker-aarch64-pc-windows-msvc.exe
          -ExpectedVersion 0.1.0-rc1

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: React ESLint
        working-directory: desktop
        run: npm run lint
      - name: React tests
        working-directory: desktop
        run: npm test
      - name: TypeScript check
        working-directory: desktop
        run: npm run typecheck
      - name: Vite production build
        working-directory: desktop
        run: npm run build

      - name: Rust cargo check
        working-directory: desktop/src-tauri
        run: cargo check --locked --target aarch64-pc-windows-msvc
      - name: Rust cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked --target aarch64-pc-windows-msvc

      - name: Build Tauri ARM64 NSIS package
        working-directory: desktop
        run: npx tauri build --bundles nsis --target aarch64-pc-windows-msvc

      - name: Verify installed bundle and generate SHA-256
        shell: pwsh
        run: >-
          ./scripts/ci/verify_windows_arm64_bundle.ps1
          -RepoRoot .
          -ExpectedVersion 0.1.0-rc1
          -ArtifactName windows-arm64-nsis

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: windows-arm64-nsis
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            SHA256SUMS-arm64.txt
            RC3-ARM64-ARTIFACT.json

  # Linux x86_64 Build
  build-linux-x64:
    if: github.event_name == 'workflow_dispatch' && vars.APEIR_BINARY_RELEASE_ENABLED == 'true' && inputs.native_target == 'linux-x64'
    name: Build Linux x86_64
    needs: [frontend-tests]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Verify native locked Kernel bytes before packaging
        run: python scripts/ci/verify_kernel_components.py --repo-root .

      - name: Build embedded Runtime sidecar
        run: |
          python -m pip install ".[installer-build]"
          pyinstaller nous-sidecar.spec
          mkdir -p desktop/src-tauri/binaries
          cp dist/nous-runtime desktop/src-tauri/binaries/nous-runtime-x86_64-unknown-linux-gnu

      - name: Build Tauri desktop
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles appimage,deb --target x86_64-unknown-linux-gnu

      - name: Smoke test AppImage
        run: |
          ls -la desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/
          ls -la desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/

      - name: Generate hashes
        run: |
          sha256sum desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage > SHA256SUMS.txt
          sha256sum desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb >> SHA256SUMS.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@v0

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: linux-x86_64
          path: |
            desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            SHA256SUMS.txt

  # macOS ARM64 Build
  build-macos-arm64:
    if: github.event_name == 'workflow_dispatch' && vars.APEIR_BINARY_RELEASE_ENABLED == 'true' && inputs.native_target == 'macos-arm64'
    name: Build macOS ARM64
    needs: [frontend-tests]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Verify native locked Kernel bytes before packaging
        run: python scripts/ci/verify_kernel_components.py --repo-root .

      - name: Build embedded Runtime sidecar
        run: |
          python -m pip install ".[installer-build]"
          pyinstaller nous-sidecar.spec
          mkdir -p desktop/src-tauri/binaries
          cp dist/nous-runtime desktop/src-tauri/binaries/nous-runtime-aarch64-apple-darwin

      - name: Build Tauri desktop
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --bundles dmg --target aarch64-apple-darwin

      - name: Smoke test DMG
        run: ls -la desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/

      - name: Generate hashes
        run: shasum -a 256 desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg > SHA256SUMS.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@v0

      - uses: actions/upload-artifact@v4
        with:
          retention-days: 14
          name: macos-arm64
          path: |
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            SHA256SUMS.txt
