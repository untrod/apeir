// NKI v1beta2 — RC8 Process & Context Extensions
// Version: 1.2.0-draft
// Date: 2026-08-05
//
// This file defines the RC8 extensions to the NKI protocol.
// It is backward-compatible with v1beta1 — all existing 25 methods
// continue to work unchanged.
//
// New in v1beta2:
// - Process management (Spawn, Signal, Get, List, Tree)
// - Context VM (MapPage, UnmapPage, Stats)
// - Proof (VerifyAction, GenerateCertificate)
// - System Twin (SimulatePlan, ReportOutcome)

syntax = "proto3";
package nous.kernel.v1beta2;

// ────────────────────────────────────────────────────────────
// RC8: Agent Process Management
// ────────────────────────────────────────────────────────────

// Spawn a new agent process.
message SpawnProcessRequest {
  string process_id = 1;            // UUID v7, client-assigned
  string parent_process_id = 2;     // Empty for root processes
  string process_group_id = 3;      // Optional group membership
  string principal_id = 4;
  string namespace = 5;
  string program_name = 6;
  string program_version = 7;
  bytes program_hash = 8;           // SHA-256 of program spec
  string goal = 9;                  // Human-readable goal
  repeated string capabilities = 10; // Narrowed from parent
  string max_capability_level = 11;
  CostBudget cost_budget = 12;
  LatencyBudget latency_budget = 13;
  EnergyBudget energy_budget = 14;
  QualityBudget quality_budget = 15;
  map<string, string> tags = 16;
}

message CostBudget {
  uint64 max_microcents = 1;
  string currency = 2;
}

message LatencyBudget {
  uint64 max_total_ms = 1;
}

message EnergyBudget {
  uint64 max_joules = 1;
}

message QualityBudget {
  double min_quality_score = 1;
  bool verification_required = 2;
  string verifier_model = 3;
}

message SpawnProcessResponse {
  string process_id = 1;
  ProcessStatus initial_status = 2;
  uint64 generation = 3;
}

enum ProcessStatus {
  PROCESS_CREATED = 0;
  PROCESS_READY = 1;
  PROCESS_RUNNING = 2;
  PROCESS_WAITING_MODEL = 3;
  PROCESS_WAITING_TOOL = 4;
  PROCESS_WAITING_IO = 5;
  PROCESS_WAITING_APPROVAL = 6;
  PROCESS_SUSPENDED = 7;
  PROCESS_CHECKPOINTING = 8;
  PROCESS_MIGRATING = 9;
  PROCESS_RECOVERING = 10;
  PROCESS_COMPLETED = 11;
  PROCESS_FAILED = 12;
  PROCESS_CANCELLED = 13;
  PROCESS_QUARANTINED = 14;
}

// ── Signal ──

message SignalProcessRequest {
  string process_id = 1;
  ProcessSignal signal = 2;
}

message ProcessSignal {
  SignalType type = 1;
  // Signal-specific payloads:
  uint64 timeout_ms = 2;            // For Pause, Cancel
  string reason = 3;                // For Cancel, Quarantine
  bool blocking = 4;                // For Checkpoint
  string trigger_event_id = 5;      // For Replan
  double min_quality = 6;           // For EscalateModel
  string preferred_model = 7;       // For EscalateModel
  BudgetType budget_type = 8;       // For ReduceBudget
  uint64 new_limit = 9;             // For ReduceBudget
  MigrationReason migration_reason = 10; // For Migrate
  string preferred_target = 11;     // For Migrate
  VerificationScope verify_scope = 12;  // For Verify
  string action_id = 13;            // For Verify (specific action)
  string investigator = 14;         // For Quarantine
}

enum SignalType {
  SIGNAL_PAUSE = 0;
  SIGNAL_RESUME = 1;
  SIGNAL_CANCEL = 2;
  SIGNAL_CHECKPOINT = 3;
  SIGNAL_REPLAN = 4;
  SIGNAL_ESCALATE_MODEL = 5;
  SIGNAL_REDUCE_BUDGET = 6;
  SIGNAL_MIGRATE = 7;
  SIGNAL_VERIFY = 8;
  SIGNAL_QUARANTINE = 9;
  SIGNAL_TERMINATE = 10;
}

enum BudgetType {
  BUDGET_COST = 0;
  BUDGET_ENERGY = 1;
  BUDGET_LATENCY = 2;
  BUDGET_TOKENS = 3;
  BUDGET_TOOL_CALLS = 4;
}

enum MigrationReason {
  MIGRATE_THERMAL = 0;
  MIGRATE_OFFLINE = 1;
  MIGRATE_RESOURCE_PRESSURE = 2;
  MIGRATE_NODE_FAILURE = 3;
  MIGRATE_LOAD_BALANCE = 4;
  MIGRATE_MANUAL = 5;
}

enum VerificationScope {
  VERIFY_NEXT_ACTION = 0;
  VERIFY_CURRENT_PHASE = 1;
  VERIFY_ALL_REMAINING = 2;
  VERIFY_SPECIFIC_ACTION = 3;
}

message SignalProcessResponse {
  string process_id = 1;
  bool accepted = 2;
  ProcessStatus new_status = 3;     // If signal changed status
  string error = 4;                 // If signal was rejected
}

// ── Get / List ──

message GetProcessRequest {
  string process_id = 1;
}

message GetProcessResponse {
  ProcessInfo process = 1;
}

message ListProcessesRequest {
  string namespace = 1;             // Filter by namespace (empty = all)
  ProcessStatus status_filter = 2;   // Filter by status
  string process_group_id = 3;       // Filter by group
  uint32 max_results = 4;            // Pagination
  string page_token = 5;             // Pagination
}

message ListProcessesResponse {
  repeated ProcessInfo processes = 1;
  string next_page_token = 2;
  uint32 total_count = 3;
}

message GetProcessTreeRequest {
  string root_process_id = 1;
  uint32 max_depth = 2;             // 0 = unlimited
}

message GetProcessTreeResponse {
  ProcessTreeNode root = 1;
}

message ProcessTreeNode {
  ProcessInfo process = 1;
  repeated ProcessTreeNode children = 2;
}

message ProcessInfo {
  string process_id = 1;
  string parent_process_id = 2;
  string process_group_id = 3;
  string namespace = 4;
  string principal_id = 5;
  string program_name = 6;
  string program_version = 7;
  uint64 program_counter = 8;
  ProcessStatus status = 9;
  ProcessStatus previous_status = 10;
  uint64 generation = 11;
  repeated string child_process_ids = 12;
  repeated string active_workload_ids = 13;
  uint32 completed_workload_count = 14;
  uint32 effect_count = 15;
  CostBudget cost_budget = 16;
  LatencyBudget latency_budget = 17;
  EnergyBudget energy_budget = 18;
  uint32 context_page_count = 19;
  double context_residency_ratio = 20;
  int64 created_at_us = 21;
  int64 status_changed_at_us = 22;
  map<string, string> tags = 23;
  string error_code = 24;
  string error_message = 25;
}

// ────────────────────────────────────────────────────────────
// RC8: Virtual Context Memory
// ────────────────────────────────────────────────────────────

message MapContextPageRequest {
  string process_id = 1;
  string page_id = 2;
  ContextPageType page_type = 3;
  uint64 size_bytes = 4;
  string physical_location = 5;     // MemoryFabric object ID
  PagePermissions permissions = 6;
  ConsistencyLevel consistency = 7;
  string namespace = 8;
  DataClassification classification = 9;
  repeated string model_compatibility = 10;
  repeated InvalidationConditionProto invalidation_conditions = 11;
  PageProvenanceProto provenance = 12;
}

enum ContextPageType {
  PAGE_TOKEN = 0;
  PAGE_SEMANTIC = 1;
  PAGE_KV = 2;
  PAGE_PREFIX = 3;
  PAGE_RETRIEVAL = 4;
  PAGE_TOOL_RESULT = 5;
  PAGE_ARTIFACT = 6;
  PAGE_SUMMARY = 7;
  PAGE_EVIDENCE = 8;
  PAGE_CHECKPOINT = 9;
}

message PagePermissions {
  bool readable = 1;
  bool writable = 2;
  bool executable = 3;
  bool sharable = 4;
}

enum ConsistencyLevel {
  CONSISTENCY_STRONG = 0;
  CONSISTENCY_VERSIONED = 1;
  CONSISTENCY_EVENTUAL = 2;
  CONSISTENCY_IMMUTABLE = 3;
  CONSISTENCY_DERIVED = 4;
  CONSISTENCY_EPHEMERAL = 5;
}

enum DataClassification {
  DATA_PUBLIC = 0;
  DATA_INTERNAL = 1;
  DATA_CONFIDENTIAL = 2;
  DATA_RESTRICTED = 3;
}

message InvalidationConditionProto {
  InvalidationConditionType type = 1;
  uint64 ttl_seconds = 2;                   // For TTL
  string source_page_id = 3;                // For SourceChanged
  string model_revision = 4;                // For ModelUpdated
  string tool_name = 5;                     // For ToolResultExpired
}

enum InvalidationConditionType {
  INVALIDATE_TTL = 0;
  INVALIDATE_SOURCE_CHANGED = 1;
  INVALIDATE_MODEL_UPDATED = 2;
  INVALIDATE_TOOL_EXPIRED = 3;
  INVALIDATE_OWNER_TERMINATED = 4;
  INVALIDATE_EXPLICIT = 5;
}

message PageProvenanceProto {
  ProvenanceSource source = 1;
  string created_by = 2;
  int64 created_at_us = 3;
  repeated string derived_from_page_ids = 4;
}

enum ProvenanceSource {
  PROVENANCE_MODEL_OUTPUT = 0;
  PROVENANCE_TOOL_EXECUTION = 1;
  PROVENANCE_USER_INPUT = 2;
  PROVENANCE_RETRIEVED = 3;
  PROVENANCE_DERIVED = 4;
  PROVENANCE_IMPORTED = 5;
}

message MapContextPageResponse {
  uint64 virtual_address = 1;
  string page_id = 2;
}

message UnmapContextPageRequest {
  string process_id = 1;
  uint64 virtual_address = 2;
}

message UnmapContextPageResponse {
  bool unmapped = 1;
}

message GetContextPageStatsRequest {
  string process_id = 1;
}

message GetContextPageStatsResponse {
  uint32 mapped_page_count = 1;
  uint64 total_mapped_bytes = 2;
  uint32 resident_page_count = 3;
  double residency_ratio = 4;
  uint64 page_fault_count = 5;
  repeated PageTypeStats by_type = 6;
}

message PageTypeStats {
  ContextPageType page_type = 1;
  uint32 count = 2;
  uint32 resident_count = 3;
  uint64 total_bytes = 4;
}

// ────────────────────────────────────────────────────────────
// RC8: Proof-Carrying Execution
// ────────────────────────────────────────────────────────────

message VerifyActionRequest {
  string action_id = 1;
  bytes canonical_spec = 2;         // Serialized ActionSpec
  bytes input_digest = 3;           // SHA-256
  string principal_id = 4;
  string capability = 5;
  bytes approval_receipt = 6;       // Serialized ApprovalReceipt
  bytes effect_receipt = 7;         // Serialized EffectReceipt (if executed)
  bytes replay_descriptor = 8;      // Serialized ReplayDescriptor
}

message VerifyActionResponse {
  bool verified = 1;
  repeated VerificationCheckResult checks = 2;
}

message VerificationCheckResult {
  string check_name = 1;
  bool passed = 2;
  string detail = 3;
}

message GenerateWorkloadCertificateRequest {
  string process_id = 1;
  repeated string action_ids = 2;   // Actions to include
}

message GenerateWorkloadCertificateResponse {
  bytes certificate = 1;            // Serialized WorkloadCertificate
  string certificate_id = 2;
  bool all_actions_verified = 3;
  uint32 total_actions = 4;
  uint32 verified_actions = 5;
}

// ────────────────────────────────────────────────────────────
// RC8: System Digital Twin
// ────────────────────────────────────────────────────────────

message SimulatePlanRequest {
  repeated CandidatePlanProto plans = 1;
  double latency_weight = 2;
  double cost_weight = 3;
  double quality_weight = 4;
}

message CandidatePlanProto {
  string plan_id = 1;
  string description = 2;
  string node_id = 3;
  string device_id = 4;
  string engine_id = 5;
  string model_revision = 6;
  uint64 estimated_input_tokens = 7;
  uint64 estimated_output_tokens = 8;
}

message SimulatePlanResponse {
  repeated PlanPredictionProto predictions = 1;
  string recommended_plan_id = 2;
}

message PlanPredictionProto {
  string plan_id = 1;
  double ttft_p50_ms = 2;
  double ttft_p95_ms = 3;
  double ttft_p99_ms = 4;
  double total_latency_p50_ms = 5;
  double total_latency_p95_ms = 6;
  double total_latency_p99_ms = 7;
  uint64 cost_p50_microcents = 8;
  uint64 cost_p95_microcents = 9;
  double quality_estimate = 10;
  double failure_probability = 11;
  uint64 peak_vram_bytes = 12;
  uint64 peak_ram_bytes = 13;
  double confidence = 14;
  bool is_out_of_distribution = 15;
}

message ReportExecutionOutcomeRequest {
  string device_id = 1;
  string engine_id = 2;
  string model_revision = 3;
  uint64 ttft_us = 4;
  uint64 tpot_us = 5;
  uint64 total_time_us = 6;
  uint64 tokens_per_second = 7;
  uint64 input_tokens = 8;
  uint64 output_tokens = 9;
  uint64 peak_vram_bytes = 10;
  uint64 peak_ram_bytes = 11;
  bool success = 12;
  string error = 13;
}

message ReportExecutionOutcomeResponse {
  bool recorded = 1;
  uint64 observation_count = 2;     // Updated count for this device
}

// ────────────────────────────────────────────────────────────
// RC8 Service Definition (extends NKI v1)
// ────────────────────────────────────────────────────────────

service NKI {
  // ── Existing 25 methods (unchanged from v1beta1) ──
  // SubmitWorkload, GetWorkload, ListWorkloads, CancelWorkload,
  // PauseWorkload, ResumeWorkload, AdmitWorkload, ReserveResources,
  // ReleaseResources, RegisterModel, ValidateModel, LoadModel,
  // UnloadModel, RegisterEngine, ProbeEngine, ListEngines,
  // RegisterDevice, ProbeDevice, ListDevices, CreateCheckpoint,
  // RestoreCheckpoint, WatchEvents, GetTrace, GetMetrics, GetHealth

  // ── RC8: Process Management (5 new RPCs) ──
  rpc SpawnProcess(SpawnProcessRequest) returns (SpawnProcessResponse);
  rpc SignalProcess(SignalProcessRequest) returns (SignalProcessResponse);
  rpc GetProcess(GetProcessRequest) returns (GetProcessResponse);
  rpc ListProcesses(ListProcessesRequest) returns (ListProcessesResponse);
  rpc GetProcessTree(GetProcessTreeRequest) returns (GetProcessTreeResponse);

  // ── RC8: Context VM (3 new RPCs) ──
  rpc MapContextPage(MapContextPageRequest) returns (MapContextPageResponse);
  rpc UnmapContextPage(UnmapContextPageRequest) returns (UnmapContextPageResponse);
  rpc GetContextPageStats(GetContextPageStatsRequest) returns (GetContextPageStatsResponse);

  // ── RC8: Proof (2 new RPCs) ──
  rpc VerifyAction(VerifyActionRequest) returns (VerifyActionResponse);
  rpc GenerateWorkloadCertificate(GenerateWorkloadCertificateRequest) returns (GenerateWorkloadCertificateResponse);

  // ── RC8: System Twin (2 new RPCs) ──
  rpc SimulatePlan(SimulatePlanRequest) returns (SimulatePlanResponse);
  rpc ReportExecutionOutcome(ReportExecutionOutcomeRequest) returns (ReportExecutionOutcomeResponse);
}
